  <body
    class="bg-surface-container-low min-h-screen flex items-center justify-center p-4"
  >
    <!-- Suppressed TopNavBar & Footer as this is a transactional page -->
    <main class="w-full max-w-[400px]">
      <div
        class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-6 sm:p-8 flex flex-col gap-6"
      >
        <div class="text-center">
          <h1 class="font-headline-xl text-headline-xl text-primary mb-2">
            MahaSewa
          </h1>
          <h2 class="font-headline-md text-headline-md text-on-surface">
            Selamat Datang
          </h2>
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
            Masuk untuk melanjutkan ke akun Anda
          </p>
        </div>
        <div class="flex flex-col gap-4">
          <button
            class="w-full flex items-center justify-center gap-2 py-2 px-4 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-on-surface font-label-md text-label-md"
          >
            <img
              alt="Google Logo"
              class="w-5 h-5"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0rYRluv6XwA1ZW220czybSQgtvy12Jw5zDNxZavTdP3RwVOFVNZv4CHFkKVE7J7TgVY1-QqgRpm_69SJntR8XssDK28ZWdS_Ot9d4VrFznsKpHCtT30ApE9-sZaRH0gKsZuSGEc-XskYC3JDrL9tpdod5B-j80kKhz0QrmqyzKWdej5YN97a_L9ePToyMU2pdjpq0mAWb7qM62cQ3UtdhouKk1JVFcvwZfbDZmRl7-trDP4OEVZ3HXhh-zPIM8v9tfbsw3VGhsuM"
            />

          </button>
          <div class="relative flex items-center py-2">
            <div class="flex-grow border-t border-outline-variant"></div>
            <span
              class="flex-shrink-0 px-3 text-on-surface-variant font-label-sm text-label-sm uppercase bg-surface-container-lowest"
              >atau</span
            >
            <div class="flex-grow border-t border-outline-variant"></div>
          </div>
          <form class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
              <label
                class="font-label-md text-label-md text-on-surface"
                for="email"
                >Email</label
              >
              <input
                class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 bg-surface-container-lowest font-body-sm text-body-sm text-on-surface placeholder:text-outline"
                id="email"
                name="email"
                placeholder="nama@email.com"
                required=""
                type="email"
              />
            </div>
            <div class="flex flex-col gap-1.5">
              <div class="flex justify-between items-center">
                <label
                  class="font-label-md text-label-md text-on-surface"
                  for="password"
                  >Kata Sandi</label
                >
                <a
                  class="font-label-sm text-label-sm text-primary hover:underline"
                  href="#"
                  >Lupa kata sandi?</a
                >
              </div>
              <input
                class="w-full px-3 py-2 border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 bg-surface-container-lowest font-body-sm text-body-sm text-on-surface placeholder:text-outline"
                id="password"
                name="password"
                placeholder="••••••••"
                required=""
                type="password"
              />
            </div>
            <button
              class="w-full py-2 px-4 bg-primary-container text-on-primary rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity mt-2"
              type="submit"
            >
              Masuk
            </button>
